<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiên Chợ Số - Nhận Code</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f4f9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 30px 25px;
            max-width: 480px;
            width: 100%;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        .logo {
            font-size: 40px;
            margin-bottom: 5px;
        }
        h1 {
            font-size: 22px;
            color: #333;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 14px;
            color: #777;
            margin-bottom: 20px;
        }
        .code-box {
            background: #f0f4ff;
            border: 2px dashed #0f3460;
            border-radius: 10px;
            padding: 18px;
            margin: 15px 0;
            position: relative;
        }
        .code-box .label {
            position: absolute;
            top: -12px;
            left: 20px;
            background: #0f3460;
            color: white;
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .code-box .code {
            font-size: 26px;
            font-weight: 700;
            color: #0f3460;
            font-family: 'Courier New', monospace;
            letter-spacing: 2px;
            word-break: break-all;
        }
        .code-box .code.loading {
            color: #999;
            font-size: 18px;
        }
        .instruction {
            background: #fff8e1;
            border-radius: 8px;
            padding: 14px;
            margin: 15px 0;
            font-size: 14px;
            color: #5d4037;
            text-align: left;
            line-height: 1.6;
        }
        .instruction strong {
            color: #d32f2f;
        }
        .btn-copy {
            background: #0f3460;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin: 5px 0;
        }
        .btn-copy:hover {
            background: #1a4a7a;
        }
        .btn-copy.copied {
            background: #2e7d32;
        }
        .footer {
            margin-top: 18px;
            font-size: 12px;
            color: #999;
        }
        .footer a {
            color: #0f3460;
            text-decoration: none;
        }
        .error {
            color: #d32f2f;
            background: #ffebee;
            padding: 12px;
            border-radius: 6px;
            margin: 15px 0;
            border-left: 4px solid #d32f2f;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo">⭐</div>
    <h1>Phiên Chợ Số Review</h1>
    <p class="subtitle">Nhận mã xác nhận để lấy xu trong bot</p>

    <div id="content">
        <div class="code-box">
            <span class="label">🔑 MÃ CỦA BẠN</span>
            <div class="code loading" id="codeDisplay">⏳ Đang tải mã...</div>
        </div>
    </div>

    <div class="instruction">
        <strong>📌 Hướng dẫn:</strong><br>
        1️⃣ Sao chép mã bên trên.<br>
        2️⃣ Quay lại Discord và nhập lệnh:<br>
        <code style="background:#e0e0e0; padding:2px 8px; border-radius:4px;">/phienchosoreview &lt;mã&gt;</code><br>
        3️⃣ Nhận ngay <strong>10 xu</strong> trong bot!
    </div>

    <button class="btn-copy" id="copyBtn">📋 Sao chép mã</button>

    <div class="footer">
        <p>Mã có hiệu lực trong <strong>10 phút</strong> • 
        <a href="#" onclick="window.location.reload();">🔄 Làm mới</a></p>
    </div>
</div>

<script>
    function getCodeFromURL() {
        const params = new URLSearchParams(window.location.search);
        return params.get('code');
    }

    const code = getCodeFromURL();
    const codeDisplay = document.getElementById('codeDisplay');
    const copyBtn = document.getElementById('copyBtn');

    if (code) {
        codeDisplay.textContent = code;
        codeDisplay.classList.remove('loading');
    } else {
        codeDisplay.textContent = '❌ Không tìm thấy mã';
        codeDisplay.style.color = '#d32f2f';
        codeDisplay.classList.remove('loading');
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error';
        errorDiv.innerHTML = '⚠️ <strong>Không tìm thấy mã!</strong><br>Vui lòng quay lại Discord và bấm nút "💰 Nhận xu" để tạo link mới.';
        document.getElementById('content').prepend(errorDiv);
    }

    copyBtn.addEventListener('click', async function() {
        const textToCopy = codeDisplay.textContent;
        if (textToCopy.includes('❌') || textToCopy.includes('⏳')) {
            alert('Không có mã để sao chép! Vui lòng làm mới trang hoặc tạo link mới.');
            return;
        }
        try {
            await navigator.clipboard.writeText(textToCopy);
            this.textContent = '✅ Đã sao chép!';
            this.classList.add('copied');
            setTimeout(() => {
                this.textContent = '📋 Sao chép mã';
                this.classList.remove('copied');
            }, 3000);
        } catch (err) {
            const textarea = document.createElement('textarea');
            textarea.value = textToCopy;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);
            this.textContent = '✅ Đã sao chép!';
            this.classList.add('copied');
            setTimeout(() => {
                this.textContent = '📋 Sao chép mã';
                this.classList.remove('copied');
            }, 3000);
        }
    });
</script>

</body>
</html>
